<style>
/* Desk portfolio — calm and functional, like a drawing office: squared paper, graphite type set in the
   machine face that goes with the dotted heading, square corners, and one oxide signal. Reading stays plain
   HTML; the desk of objects, with a place card for each, is the navigation. */

:root {
  color-scheme: light;
  --bg: #dfe2d8;
  --bg-2: #d6dacd;
  --panel: #ecefe5;
  --panel-2: #e5e8dd;
  --line: #c9cec0;
  --line-2: #aeb4a3;
  --ink: #1b201b;
  --ink-2: #3e443c;
  --muted: #5e645a;
  --dim: #949a8c;
  --accent: #b2461f;
  --accent-text: #93360f;
  /* One face throughout, to go with the heading printed in dots: the system's own machine type. */
  --mono: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --sans: var(--mono);
  --label: 500 0.68rem/1.5 var(--mono);
  --radius: 4px;
  --wrap: 84rem;
  --gutter: clamp(1rem, 3vw, 2rem);
  --readbar: 2.9rem; /* the slim bar while reading, leaving the screen to the work */
  --shadow: 0 1px 2px rgba(31, 31, 29, 0.06), 0 8px 24px rgba(31, 31, 29, 0.06);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0; color: var(--ink); font: 400 0.9rem/1.75 var(--mono); font-variant-numeric: tabular-nums;
  min-height: 100vh; min-height: 100dvh;
  /* Faint squared paper, the same grid the desk's board is ruled with. */
  background: radial-gradient(circle, rgba(27, 32, 27, 0.06) 1px, transparent 1.4px) 0 0 / 22px 22px, var(--bg);
}
img { display: block; max-width: 100%; height: auto; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--ink); text-underline-offset: 0.2em; text-decoration-color: var(--line-2); }
a:hover { text-decoration-color: var(--accent); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
h1, h2, h3, h4, p, figure { margin: 0; }
ul, ol { margin: 0; padding: 0; }
::selection { background: var(--accent); color: var(--ink); }

.skip { position: absolute; left: 1rem; top: -10rem; z-index: 50; padding: 0.5rem 0.9rem; border-radius: 3px; background: var(--ink); color: var(--panel); font: var(--label); letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; }
.skip:focus { top: 0.6rem; }
.eyebrow { font: var(--label); letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }

/* The desk page is fitted to the window: the links, the name, the filters, the desk and the footer share the
   height between them, and whatever is left goes to the desk, which is the thing worth the room. Nothing is
   clipped to make that happen — if the window is very short, or the text is enlarged, the page simply scrolls
   as any other page would. Reading a project is an ordinary scrolling document. */
body[data-view="desk"] { display: flex; flex-direction: column; }
body[data-view="desk"] > main { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
body[data-view="desk"] .deck { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
body[data-view="desk"] .stage { flex: 1 1 0; min-height: 11rem; }   /* all the room that is left, and no more */

/* ---- frame ---- */
/* `width: 100%` matters on the desk page, where these are flex items: with auto side margins and no width
   they would otherwise shrink to fit their text instead of holding the column. */
.top, .intro, .desk, .reader, .index, .bottom { width: 100%; max-width: var(--wrap); margin-inline: auto; padding-inline: var(--gutter); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem 2rem; flex-wrap: wrap; padding-block: 1rem; }
.brand { display: flex; align-items: center; gap: 0.25rem 0.75rem; flex-wrap: wrap; color: var(--ink); text-decoration: none; }
.brand__name { font: 500 0.78rem/1 var(--mono); letter-spacing: 0.2em; text-transform: uppercase; }
body[data-view="desk"] .brand { display: none; }   /* the plate below is the name */
body[data-view="desk"] .top { justify-content: flex-end; }
.utilities { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.utilities a, .textlink { display: inline-block; padding: 0.4rem 0.8rem; border: 1px solid var(--line-2); border-radius: 3px; font: var(--label); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); text-decoration: none; background: transparent; }
.utilities a:hover, .textlink:hover { border-color: var(--ink); color: var(--ink); }
.utilities a[aria-current="page"] { border-color: var(--ink); background: var(--ink); color: var(--panel); }
.bottom { display: flex; justify-content: space-between; gap: 0.6rem 1rem; flex-wrap: wrap; padding-block: 0 2rem; font: var(--label); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.footrule { display: block; flex-basis: 100%; max-width: 100%; margin-bottom: 1rem; }   /* the printed rule, in dots (grain.js) */

/* ---- the name, projected on the wall behind the desk (desk view only) ---- */
.intro { position: relative; z-index: 1; padding-block: clamp(0.9rem, 2.4vh, 1.8rem) 0.2rem; text-align: center; }
.intro .eyebrow { margin-top: 0.8rem; }
.projection { position: relative; display: inline-block; max-width: 100%; vertical-align: top; }
/* The frame is drawn a dot per canvas pixel and blown up square (title.js); a faint green light spills round it. */
.title { display: block; max-width: 100%; margin: 0 auto; image-rendering: pixelated; filter: drop-shadow(0 0 16px rgba(140, 170, 85, 0.3)); }
.projection__pause {
  position: absolute; right: 0.4rem; bottom: 0.4rem; display: grid; place-items: center; width: 1.6rem; height: 1.6rem; padding: 0;
  border: 1px solid rgba(140, 170, 85, 0.6); border-radius: 2px; background: rgba(14, 16, 13, 0.75); color: #8caa55; opacity: 0.6;
}
.projection:hover .projection__pause, .projection__pause:focus-visible, .projection__pause[aria-pressed="true"] { opacity: 1; }
.projection__pause span { width: 0.52rem; height: 0.58rem; box-sizing: border-box; border-inline: 0.17rem solid currentColor; }   /* two bars */
.projection__pause[aria-pressed="true"] span { width: 0; height: 0; border: 0; border-left: 0.52rem solid currentColor; border-block: 0.32rem solid transparent; }   /* play */
.intro__line { margin-top: 0.45rem; font: var(--label); letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
.intro__line b { font-weight: 500; color: var(--ink-2); }
.intro__plain { font: 500 1.6rem/1.2 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; }
.visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---- the desk: every project as an object, each with a place card ---- */
/* The desk's room: one wall behind the name and the desk alike, so the projection hangs where the desk stands. */
.deck {
  position: relative; border-block: 1px solid var(--line);
  background:
    radial-gradient(circle, rgba(27, 32, 27, 0.09) 1px, transparent 1.5px) 0 0 / 20px 20px,
    radial-gradient(120% 95% at 50% 38%, #eef0e8 0%, #e3e7db 68%, #d9ddd0 100%);
}
/* The filters sit under the desk, above the footer. */
.filters { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: center; padding: 0.5rem var(--gutter) 0.8rem; }
.chip { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.36rem 0.75rem 0.36rem 0.4rem; border: 1px solid var(--line-2); border-radius: 3px; background: var(--panel); font: var(--label); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
.chip[data-filter=""] { padding-left: 0.75rem; }
.chip__num { display: grid; place-items: center; width: 1.2rem; height: 1.2rem; border: 1px solid currentColor; font: 500 0.58rem/1 var(--mono); letter-spacing: 0; }
.chip:hover { border-color: var(--ink); color: var(--ink); }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--panel); }
.stage { position: relative; height: 22rem; overflow: hidden; }   /* the desk page overrides this with the room it has */
.stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: pan-y; }
.stage__status { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; padding: 1rem; text-align: center; font: var(--label); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

/* Labels: none until an object is pointed at, selected or reached with the keyboard; then one card stands
   above it, joined by a short rule. They stay in the page for keyboards and screen readers. */
.tags { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.tag {
  position: absolute; left: 0; top: 0; display: grid; justify-items: center; gap: 0.06rem; padding: 0.42rem 0.8rem 0.48rem;
  border: 1px solid var(--line-2); border-radius: 3px; background: rgba(236, 239, 229, 0.97); box-shadow: var(--shadow);
  color: var(--ink); text-align: center; text-decoration: none; white-space: nowrap;
  opacity: 0; pointer-events: none; transform: translate3d(-9999px, 0, 0); transition: opacity 0.15s ease;
}
.tag::after { content: ""; position: absolute; left: var(--lead, 50%); top: 100%; width: 1px; height: 15px; background: var(--ink-2); opacity: 0.4; }
.tag[data-side="below"]::after { top: auto; bottom: 100%; }
.tag[data-tail="false"]::after { display: none; }   /* stacked labels: only the one beside the object points at it */
.tag[data-show="true"], .tag:focus-visible { z-index: 3; opacity: 1; pointer-events: auto; }
.tag[data-faded="true"]:not(:focus-visible) { visibility: hidden; }
.tag:hover { border-color: var(--ink-2); }
.tag__cat { font: 500 0.58rem/1.3 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.tag__title { font: 500 0.84rem/1.3 var(--mono); letter-spacing: 0.02em; text-transform: uppercase; }
.tag__open { margin-top: 0.1rem; font: 500 0.62rem/1.3 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-text); }
.tag:focus-visible { outline-offset: 2px; }

/* Category names printed on the board, at the start of each group's rule. */
.grouplabels { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.grouplabel {
  position: absolute; left: 0; top: 0; display: flex; align-items: baseline; gap: 0.5rem; white-space: nowrap;
  transform: translate3d(-9999px, 0, 0); transition: opacity 0.3s ease;
  font: 500 0.6rem/1.2 var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-2);
}
.grouplabel b { font-weight: 500; color: var(--accent-text); }
.grouplabel[data-faded="true"] { opacity: 0.3; }

/* The shelf's steps (phones). */
.shelfnav {
  position: absolute; top: 50%; z-index: 3; display: none; width: 2.75rem; height: 2.75rem; margin-top: -1.375rem;
  border: 1px solid var(--line-2); border-radius: 3px; background: rgba(236, 239, 229, 0.92); box-shadow: 0 1px 2px rgba(27, 32, 27, 0.08);
  font-size: 1.35rem; line-height: 1; color: var(--ink);
}
.stage[data-mode="shelf"] .shelfnav { display: grid; place-items: center; }
.shelfnav--prev { left: 0.5rem; }
.shelfnav--next { right: 0.5rem; }
.shelfnav:disabled { opacity: 0.3; cursor: default; }

/* The PC's two-choice menu. */
.pcmenu { position: absolute; left: 0; top: 0; z-index: 6; width: 16.5rem; padding: 0.75rem 0.6rem 0.6rem; border: 1px solid var(--line-2); border-radius: 4px; background: var(--panel); box-shadow: var(--shadow); }
.pcmenu__title { margin: 0 0 0.4rem 0.35rem; font: var(--label); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.pcmenu__item { display: grid; padding: 0.5rem 0.6rem; border-radius: 3px; color: var(--ink); text-decoration: none; }
.pcmenu__item + .pcmenu__item { margin-top: 0.15rem; }
.pcmenu__item:hover, .pcmenu__item:focus-visible { background: var(--bg-2); }
.pcmenu__item span { font: 500 0.84rem/1.3 var(--mono); letter-spacing: 0.02em; text-transform: uppercase; }
.pcmenu__item small { font: 400 0.7rem/1.4 var(--mono); color: var(--muted); }
.pcmenu__close { position: absolute; top: 0.3rem; right: 0.45rem; width: 1.8rem; height: 1.8rem; border: 0; border-radius: 3px; background: none; font-size: 1.1rem; line-height: 1; color: var(--muted); }
.pcmenu__close:hover { background: var(--bg-2); color: var(--ink); }

.hud { position: absolute; inset: 0; z-index: 1; pointer-events: none; font: var(--label); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
/* A short desk needs its bottom strip for the category names, so the hint stands down. The shelf keeps its
   counter, which says where you are along it. */
.stage[data-short="true"]:not([data-mode="shelf"]) .hud { display: none; }
.hud span { position: absolute; bottom: 1rem; }
.hud__bl { left: 1.4rem; display: flex; align-items: center; gap: 0.5rem; }
.hud__bl::before { content: ""; width: 0.35rem; height: 0.35rem; background: var(--dim); }
.stage[data-hovering="true"] .hud__bl::before { background: var(--accent); }
.hud__br { right: 1.4rem; text-align: right; color: var(--dim); }

/* The way to the section's projects as a plain list, beside its filter chip. */
.chip--go { text-decoration: none; }
.chip--go:hover { border-color: var(--ink); color: var(--ink); }

/* No WebGL: every project listed instead of the desk. */
body.no-3d .stage, body.no-3d .filters { display: none; }
body:not(.no-3d) #fallback-index { display: none; }
body.no-3d .deck::after { content: "The 3D desk isn\2019t available in this browser, so every project is listed below."; display: block; padding: 1rem var(--gutter); font: var(--label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* ---- reading: the desk steps aside for a slim bar ---- */
.readbar { display: none; }
body:not([data-view="desk"]) .deck { display: none; }
body:not([data-view="desk"]) .readbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 0.8rem; min-height: var(--readbar);
  padding: 0.45rem var(--gutter); border-block: 1px solid var(--line); background: rgba(223, 226, 216, 0.95); overflow-x: auto; scrollbar-width: none;
}
.readbar__back { flex: none; padding: 0.34rem 0.75rem; border: 1px solid var(--ink); border-radius: 3px; background: var(--ink); color: var(--panel); font: var(--label); letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; }
.readbar__links { display: flex; gap: 0.25rem; }
.readbar__links a { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.26rem 0.55rem 0.26rem 0.25rem; border-radius: 3px; color: var(--ink-2); font: var(--label); letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; white-space: nowrap; }
.readbar__links a:hover { background: var(--bg-2); }
.readbar__links a[aria-current="true"] { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink); }
.readbar__links .chip__num { width: 1.1rem; height: 1.1rem; }

/* ---- the index, and the plain list shown in place of the desk when there is no WebGL ---- */
.desk, .index { padding-block: 2.2rem 3rem; }
body:not(.no-3d) #desk-view { display: none; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.3rem; }
.section-head h2 { font: 500 0.82rem/1.3 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; }
.section-head--large h2 { font: 500 clamp(1.1rem, 0.9rem + 0.7vw, 1.5rem)/1.2 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
.section-head h2:focus { outline: none; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); gap: 1.6rem 1.1rem; }
.card { display: block; color: var(--ink); text-decoration: none; }
.card__media { position: relative; display: block; aspect-ratio: 4 / 3; margin-bottom: 0.75rem; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); transition: box-shadow 0.3s ease, border-color 0.3s ease; }
.card__media img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.5s ease; }
.card__tag { position: absolute; left: 0.5rem; top: 0.5rem; padding: 0.22rem 0.45rem; border-radius: 2px; background: rgba(236, 239, 229, 0.92); font: 500 0.6rem/1.3 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.card:hover .card__media, .card:focus-visible .card__media { border-color: var(--line-2); box-shadow: var(--shadow); }
.card:hover .card__media img, .card:focus-visible .card__media img { transform: scale(1.03); }
.card strong { display: block; font: 500 0.86rem/1.35 var(--mono); letter-spacing: 0.03em; text-transform: uppercase; }
.card small { display: block; margin-top: 0.2rem; font: 400 0.7rem/1.5 var(--mono); letter-spacing: 0.02em; color: var(--muted); }
.card .noimg { display: grid; place-items: center; height: 100%; font: var(--label); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.index__group { margin-top: 2.4rem; }
.index__group h3 { display: flex; gap: 0.6rem; align-items: center; margin-bottom: 1rem; padding-top: 0.8rem; border-top: 1px solid var(--line); font: 500 0.82rem/1.3 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; }
.index__group h3 span { display: grid; place-items: center; width: 1.35rem; height: 1.35rem; background: var(--ink); color: var(--panel); font: 500 0.6rem/1 var(--mono); }

/* ---- reading view ---- */
.reader { padding-block: 1.6rem 3rem; }
.reader, .story { scroll-margin-top: calc(var(--readbar) + 1rem); }
.folio { overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); box-shadow: var(--shadow); }
.folio__head { display: flex; justify-content: space-between; align-items: end; gap: 1rem; padding: 1.2rem clamp(1rem, 2.5vw, 1.8rem) 1.1rem; border-bottom: 1px solid var(--line); background: var(--panel-2); }
.folio__head h2 { margin-top: 0.35rem; font: 500 clamp(1rem, 0.85rem + 0.6vw, 1.35rem)/1.2 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
.folio__head h2:focus { outline: none; }
.folio__body { display: grid; grid-template-columns: 15.5rem minmax(0, 1fr); min-height: 24rem; }
.folio__body--single { grid-template-columns: minmax(0, 1fr); }
.plist { padding: 0.6rem; border-right: 1px solid var(--line); }
.plist a { position: relative; display: grid; grid-template-columns: 2.6rem minmax(0, 1fr); padding: 0.6rem 0.7rem; border-radius: 3px; color: var(--ink-2); text-decoration: none; font: 500 0.78rem/1.4 var(--mono); letter-spacing: 0.02em; text-transform: uppercase; }
.plist a + a { margin-top: 0.15rem; }
.plist a .code { grid-row: span 2; font: 500 0.68rem/1.9 var(--mono); color: var(--dim); }
.plist a small { margin-top: 0.2rem; font: 400 0.66rem/1.45 var(--mono); letter-spacing: 0.01em; text-transform: none; color: var(--muted); }
.plist a:hover { background: var(--bg); color: var(--ink); }
.plist a[aria-current="true"] { background: var(--bg-2); color: var(--ink); }
.plist a[aria-current="true"] .code { color: var(--accent-text); }

.story { min-width: 0; padding: 1.6rem clamp(1rem, 3vw, 2.4rem) 2.4rem; }
.story h3 { margin: 0.5rem 0 1.2rem; font: 500 clamp(1.25rem, 0.95rem + 1.2vw, 1.85rem)/1.2 var(--mono); letter-spacing: 0.04em; text-transform: uppercase; }
.story h3:focus { outline: none; }
.summary { max-width: 68ch; margin-top: 1.3rem; font-size: 0.86rem; line-height: 1.85; }
/* "Try the instrument": the one filled button on a project page. */
.action { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1.1rem; margin-top: 1.3rem; }
.action__go { display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.7rem 1.1rem; border: 1px solid var(--ink); border-radius: 3px; background: var(--ink); color: var(--panel); font: 500 0.74rem/1.2 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; }
.action__go:hover { border-color: var(--accent); background: var(--accent); color: var(--panel); }
.action__note { max-width: 46ch; font: 400 0.72rem/1.6 var(--mono); color: var(--muted); }

.gallery figure { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel-2); }
.gallery__main { width: 100%; height: clamp(16rem, 48vh, 30rem); object-fit: contain; }
.gallery figcaption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.2rem 1.2rem; padding: 0.6rem 0.8rem; border-top: 1px solid var(--line); background: var(--panel); font: 400 0.72rem/1.55 var(--mono); letter-spacing: 0.02em; color: var(--ink-2); }
.gallery__credit { font-size: 0.66rem; color: var(--muted); }
.gallery__bar { display: flex; justify-content: space-between; align-items: start; gap: 0.6rem 1rem; flex-wrap: wrap; margin-top: 0.7rem; }
.thumbs { display: flex; flex-wrap: wrap; gap: 0.45rem; list-style: none; }
.thumb { width: 4.4rem; height: 3.3rem; padding: 0.15rem; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); }
.thumb img { width: 100%; height: 100%; object-fit: contain; border-radius: 2px; }
.thumb[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
/* A collection shown whole (the patches): square tiles in the paper they were photographed on, so a stray
   fibre or the shadow under a patch reads as part of the photograph rather than as a ragged cut. */
.gallery--grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.7rem; }
.gallery--grid figure { display: flex; flex-direction: column; background: var(--panel-2); border-color: var(--line); }
.gallery--grid img { width: 100%; aspect-ratio: 1; object-fit: contain; }   /* each cut-out carries its own margin */
.gallery--grid figure.fill img { object-fit: cover; }
.gallery--grid figcaption { flex: 1; flex-direction: column; justify-content: start; gap: 0.1rem; padding: 0.5rem 0.7rem 0.6rem; font-size: 0.82rem; }
.gallery--grid .gallery__credit { font-size: 0.74rem; }
@media (max-width: 40rem) { .gallery--grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; } }
.gallery__steps { display: flex; align-items: center; gap: 0.45rem; }
.gallery__count { margin-right: 0.35rem; font: 400 0.7rem/1.4 var(--mono); letter-spacing: 0.06em; color: var(--muted); }
.step { width: 2.2rem; height: 2.2rem; border: 1px solid var(--line-2); border-radius: 3px; background: var(--panel); font: 500 0.95rem/1 var(--sans); box-shadow: var(--shadow); }
.step:hover { border-color: var(--ink); }
.step:active { background: var(--bg-2); }

.modules { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: 0.75rem; margin-top: 1.6rem; }
.module { padding: 1rem 1.1rem 1.15rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel-2); }
.module h4 { display: flex; align-items: center; gap: 0.55rem; margin-bottom: 0.6rem; font: 500 0.78rem/1.35 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
.module h4 span { display: grid; place-items: center; width: 1.3rem; height: 1.3rem; border: 1px solid var(--ink); font: 500 0.6rem/1 var(--mono); }
.module p { font-size: 0.78rem; line-height: 1.75; color: var(--ink-2); }
.module ul { display: grid; gap: 0.3rem; list-style: none; }
.module li { position: relative; padding-left: 1rem; font: 400 0.78rem/1.7 var(--mono); letter-spacing: 0.01em; color: var(--ink-2); }
.module li::before { content: ""; position: absolute; left: 0.1rem; top: 0.6em; width: 0.32rem; height: 0.32rem; background: var(--ink-2); }
.module .note { margin-top: 0.7rem; font: 400 0.72rem/1.6 var(--mono); color: var(--muted); }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: 1.4rem 2.2rem; margin-top: 1.8rem; padding-top: 1.3rem; border-top: 1px solid var(--line); }
.facts h4 { margin-bottom: 0.7rem; font: var(--label); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.facts ul { display: grid; gap: 0.45rem; list-style: none; }
.facts li { position: relative; padding-left: 1.1rem; font: 400 0.78rem/1.7 var(--mono); letter-spacing: 0.01em; color: var(--ink-2); }
.facts li::before { content: ""; position: absolute; left: 0.15rem; top: 0.62em; width: 0.32rem; height: 0.32rem; background: var(--line-2); }
.outcome { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; gap: 0.3rem 1rem; max-width: 72ch; margin-top: 1.6rem; padding: 0.9rem 1.1rem; border: 1px solid var(--line); border-radius: var(--radius); font: 400 0.78rem/1.7 var(--mono); background: var(--panel-2); }
.outcome strong { display: flex; align-items: center; gap: 0.45rem; font: var(--label); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
.links a { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.45rem 0.8rem; border: 1px solid var(--line-2); border-radius: 3px; font: var(--label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); text-decoration: none; }
.links a:hover { border-color: var(--ink); color: var(--ink); }
/* The contact form on the CV page (only once a form endpoint is set): plain fields in the page's type. */
.cform { display: grid; gap: 0.9rem; max-width: 34rem; margin-top: 1.1rem; }
.cform__field { display: grid; gap: 0.35rem; font: var(--label); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.cform input, .cform textarea { width: 100%; padding: 0.6rem 0.7rem; border: 1px solid var(--line-2); border-radius: 3px; background: #fff; color: var(--ink); font: 400 1rem/1.5 var(--mono); letter-spacing: 0; text-transform: none; }
.cform textarea { resize: vertical; min-height: 8rem; }
.cform input:focus, .cform textarea:focus { border-color: var(--ink); outline: none; }
.cform__trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.cform__row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1rem; }
.cform button:disabled { opacity: 0.6; cursor: wait; }
.cform__status { font: 400 0.76rem/1.6 var(--mono); color: var(--ink-2); }
.cform__note { font: 400 0.72rem/1.6 var(--mono); color: var(--muted); }

/* Technical drawings ("sheets"): one to a sheet, on white with room round it, the title and a line on what kind of
   drawing it is beneath. Click or tap to enlarge. */
.sheets { display: grid; gap: 1.4rem; margin-top: 1.6rem; }
.sheet { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); }
.sheet__open { position: relative; display: block; width: 100%; padding: clamp(0.8rem, 2.6vw, 2rem); border: 0; background: #fff; cursor: zoom-in; }
.sheet__open img { display: block; width: 100%; height: auto; max-height: 72vh; object-fit: contain; }
.sheet__zoom { position: absolute; right: 0.7rem; bottom: 0.7rem; padding: 0.3rem 0.6rem; border: 1px solid var(--line-2); border-radius: 3px; background: rgba(255, 255, 255, 0.94); font: var(--label); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); opacity: 0; transition: opacity 0.2s; }
.sheet__open:hover .sheet__zoom, .sheet__open:focus-visible .sheet__zoom { opacity: 1; }
@media (hover: none) { .sheet__zoom { opacity: 1; } }
.sheet figcaption { display: grid; gap: 0.25rem; padding: 0.75rem 1rem 0.85rem; border-top: 1px solid var(--line); }
.sheet__title { font: 500 0.74rem/1.3 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); }
.sheet__caption { max-width: 72ch; font: 400 0.76rem/1.65 var(--mono); color: var(--ink-2); }

/* The enlarged drawing, over everything: a thin bar of controls and the sheet itself, zoomable and pannable. */
.viewer { position: fixed; inset: 0; z-index: 60; display: grid; grid-template-rows: auto minmax(0, 1fr); background: rgba(24, 26, 23, 0.97); color: #eef0e8; animation: viewer-in 0.18s ease-out; }
.viewer[hidden] { display: none; }
@keyframes viewer-in { from { opacity: 0; } }
.viewer__bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.5rem 1rem; padding: 0.6rem clamp(0.75rem, 2vw, 1.4rem); border-bottom: 1px solid rgba(255, 255, 255, 0.12); background: #181a17; }
.viewer__text { min-width: 0; }
.viewer__title { font: 500 0.74rem/1.3 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; }
.viewer__caption { max-width: 80ch; margin-top: 0.15rem; font: 400 0.72rem/1.5 var(--mono); color: #b9beb1; }
.viewer__tools { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; }
.viewer__count { margin-right: 0.4rem; font: 400 0.7rem/1 var(--mono); color: #b9beb1; }
.viewer__btn { min-width: 2.3rem; height: 2.3rem; padding: 0 0.55rem; border: 1px solid rgba(255, 255, 255, 0.28); border-radius: 3px; background: transparent; color: #eef0e8; font: 500 0.8rem/1 var(--mono); letter-spacing: 0.06em; }
.viewer__btn:hover { border-color: #fff; }
.viewer :focus-visible { outline-color: #fff; }
.viewer__stage { position: relative; overflow: hidden; touch-action: none; cursor: grab; }
.viewer__stage:active { cursor: grabbing; }
.viewer__img { position: absolute; left: 0; top: 0; max-width: none; transform-origin: 0 0; background: #fff; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35); user-select: none; -webkit-user-drag: none; }
html.viewing { overflow: hidden; }

.next { display: flex; justify-content: flex-end; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--line); }
.next a { text-align: right; font: 500 0.86rem/1.4 var(--mono); letter-spacing: 0.03em; text-transform: uppercase; text-decoration: none; }
.next a span { display: block; font: var(--label); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.next a:hover { color: var(--accent-text); }

/* ---- CV folio ---- */
.cv .headline { margin-bottom: 1.2rem; font: 500 0.78rem/1.6 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.cv section { margin-top: 1.6rem; padding-top: 1.1rem; border-top: 1px solid var(--line); }
.cv section > p { font-size: 0.8rem; line-height: 1.8; }
.cv section > h4 { margin-bottom: 0.9rem; font: var(--label); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.job { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 0.2rem 1.4rem; margin-bottom: 1.1rem; }
.job .dates { grid-row: span 2; font: 400 0.7rem/1.9 var(--mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.job .role { font: 500 0.86rem/1.45 var(--mono); letter-spacing: 0.03em; text-transform: uppercase; }
.job .desc { font-size: 0.78rem; line-height: 1.75; color: var(--ink-2); }
.skills { display: grid; gap: 0.5rem; margin: 0; }
.skills div { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 1.4rem; font-size: 0.8rem; }
.skills dt { font: 500 0.72rem/1.75 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
.skills dd { margin: 0; font: 400 0.78rem/1.7 var(--mono); letter-spacing: 0.01em; color: var(--ink-2); }
.contact-lines { display: flex; flex-wrap: wrap; gap: 0.5rem 1.8rem; font: 500 0.95rem/1.5 var(--mono); letter-spacing: 0.02em; }
.contact-lines a { text-decoration-color: var(--accent); }
.printlink { margin-top: 1.1rem; }

@media (max-width: 52rem) {
  .intro { grid-template-columns: minmax(0, 1fr); }
  .intro__text { grid-column: 1; justify-self: start; }
  .folio__body { grid-template-columns: minmax(0, 1fr); }
  .plist { display: flex; gap: 0.3rem; overflow-x: auto; padding: 0.5rem; border-right: 0; border-bottom: 1px solid var(--line); }
  .plist a { flex: 0 0 auto; grid-template-columns: auto; max-width: 15rem; }
  .plist a + a { margin-top: 0; }
  .plist a .code { grid-row: auto; line-height: 1.3; }
  .plist a small { display: none; }
  .job, .skills div { grid-template-columns: minmax(0, 1fr); gap: 0.1rem; }
  .job .dates { grid-row: auto; }
  .gallery__main { height: auto; aspect-ratio: 4 / 3; }
}

/* Short windows: the same page, with the air taken out of it rather than the desk. */
@media (max-height: 760px) {
  .top { padding-block: 0.55rem; }
  .intro { padding-block: 0.6rem 0.1rem; }
  .bottom { padding-block: 0 0.9rem; }
  .footrule { margin-bottom: 0.55rem; }
}
@media (max-height: 620px) {
  .intro { padding-block: 0.4rem 0; }
  .intro__line { margin-top: 0.25rem; }
  .filters { padding-block: 0.35rem 0.5rem; }
}

@media (max-width: 40rem) {
  .top { padding-block: 0.5rem; }
  .intro { padding-block: 0.7rem 0.1rem; }
  .intro__line { margin-top: 0.4rem; font-size: 0.6rem; letter-spacing: 0.1em; }
  .filters {
    flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start;
    padding: 0.5rem var(--gutter) 0.7rem; scrollbar-width: none;
    /* the last chip fades out at the edge, so it is clear the row carries on */
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 2rem), transparent);
    mask-image: linear-gradient(to right, #000 calc(100% - 2rem), transparent);
  }
  .filters::-webkit-scrollbar { display: none; }
  .filters:focus-within { -webkit-mask-image: none; mask-image: none; }   /* a chip reached by keyboard is never under the fade */
  .chip { flex: 0 0 auto; }
  .hud span { bottom: 0.8rem; }
  .hud__bl { left: 1rem; max-width: calc(100% - 6.5rem); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .hud__bl::before { display: inline-block; margin-right: 0.45rem; vertical-align: 0.1em; }
  .hud__br { right: 1rem; }
  .stage:not([data-mode="shelf"]) .hud__br { display: none; }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---- on paper: a project or the CV printed for an application ---- */
@media print {
  @page { margin: 16mm; }
  body { background: #fff; color: #000; }
  .skip, .utilities, .readbar, .deck, .title, .projection__pause, .footrule, .tags, .hud, .pcmenu,
  .gallery__bar, .next, .shelfnav, .plist, .folio__head .textlink, .printlink, .viewer, .sheet__zoom, .action { display: none !important; }
  .sheet { box-shadow: none; border-color: #ddd; }
  .sheet__open img { max-height: 16cm; }
  .folio__body { display: block; }          /* without the project list beside it, the story takes the page */
  /* the words behind the dot-matrix heading take its place */
  .visually-hidden { position: static; width: auto; height: auto; clip-path: none; font: 600 1.4rem/1.3 var(--sans); }
  .top { border-bottom: 1px solid #ddd; }
  .folio, .card__media, .gallery figure, .thumb { border-color: #ddd; box-shadow: none; }
  .gallery__main { height: auto; max-height: 11cm; }
  .story a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 0.82em; color: #444; word-break: break-all; }
  h1, h2, h3, h4 { break-after: avoid; }
  figure, .job, .module, .facts > div { break-inside: avoid; }
  .reader, .index, .desk { padding-inline: 0; }
}

er","Renders: Stephen Green at Bib Design, from my 3D models"],"outcome":"Released and made to order. HF1, HF2 MK2 and HF3 each have a product page on TPI's website.","links":[{"label":"TPI: Type. HF1","href":"https://www.tpi.co.uk/products/type-hf1"},{"label":"TPI: Type. HF2 MK2","href":"https://www.tpi.co.uk/products/type-hf2-mk2"},{"label":"TPI: Type. HF3","href":"https://www.tpi.co.uk/products/type-hf3"}],"gallery":["hf-web-hf1-front","hf-web-hf1-rear","hf-web-hf2-front","hf-web-hf2-rear","hf-web-hf3-front","hf-web-hf3-rear"]},{"id":"cinema-movement","category":"sound","title":"Cinema and Movement ranges","context":"TPI Aerospace Limited · released","summary":"Two ranges of cinema loudspeakers for TPI. The cinema range covers screen, surround, subwoofer and bass-management models for cinemas, screening rooms and studios. Movement is for direct-view LED screens: the Movement L, M and S sit in arrays above and below the screen, and TPI's signal processing blends them so the sound appears to come from the picture.","mine":["All design and engineering for every model in the cinema range — screen, surround, subwoofer and bass-management speakers — and the Movement range","The enclosure for the Movement controller","Manufacturing and production drawings and files","All the line drawings for the cinema and Movement ranges, as used in TPI's specifications and brochure"],"credits":["Acoustic engineering: Ian Knight","Product photographs: TPI in-house photographer","Movement controller electronics and signal processing: TPI"],"outcome":"Released. Both ranges are listed on TPI's website.","links":[{"label":"TPI: Cinema full range","href":"https://www.tpi.co.uk/collections/cinema-full-range"},{"label":"TPI: Movement","href":"https://www.tpi.co.uk/collections/movement"}],"gallery":["cinema-2-8","cinema-application","movement-l","movement-components","cinema-3-8sl-mounting","cinema-bm12","cinema-screen-wall"]},{"id":"clarity","category":"sound","title":"Clarity A and Clarity M","context":"Mastersounds · through TPI Aerospace Limited · 2024–2025","summary":"I redeveloped the existing Clarity A home DJ audio system for efficient, cost-effective manufacture, and designed the Clarity M modular PA from start to finish to a Mastersounds brief.","mine":["The only product designer on the project","Clarity A: redesign and engineering development for manufacture","Clarity M: modules, stacking, handling and flying, with 12-inch or 15-inch subwoofers and 8-inch or 12-inch tops"],"credits":["Acoustic engineering: Ian Knight at TPI","Product photography: Mastersounds"],"outcome":"Clarity A and Clarity M are released and on sale; Clarity M production units were built by September 2024.","gallery":["clarity-m-stacks","clarity-a-front","clarity-m-large-array"]},{"id":"wilson-benesch","category":"sound","title":"Eminence and Precision","context":"Wilson Benesch · 2017–2018 · released November 2018","summary":"Design engineering on the Eminence flagship loudspeaker and the new Precision Series entry-level range, with SolidWorks models, drawings, bills of materials and an in-house 3D-printing workflow.","mine":["Helped develop Eminence; developed Precision as a new entry-level range, including CAD, technical drawings and marketing renders","Designed and 3D modelled the Fibonacci-pattern dust caps and decoupled tweeter faceplate with a materials science PhD student on placement, overseen by the Design and Engineering Director — and took responsibility for printing them in-house","Researched, specified and set up in-house 3D printing, giving the team control over new and complex parts"],"credits":["Eminence hero render: led by Luke Milnes, using my 3D model and with my assistance","Precision line-up: my KeyShot render","Product images of the released loudspeakers: Wilson Benesch","Manufacture: Wilson Benesch's in-house team"],"outcome":"Eminence and the Precision Series were released in November 2018. The dust caps and tweeter faceplates developed for Eminence were also applied to Precision.","gallery":["wb-eminence-render","wb-precision-lineup","wb-render-2018","wb-web-eminence-black","wb-web-eminence-pair","wb-web-tactic-3","wb-web-fibonacci-tweeter","wb-web-eminence-foot","wb-web-p1","wb-web-p2","wb-web-p3","wb-web-leonardo","wb-web-p2-feet"]},{"id":"mfr","category":"sound","title":"Type. MFR","context":"TPI Aerospace Limited · re-engineering","summary":"Re-engineering of the Type. MFR loudspeaker, a horn-loaded design with a tall slatted enclosure, including an additional riser section I designed in natural ply.","mine":["Re-engineering of the product","An additional riser section, designed in natural ply"],"credits":["Photo of the natural-ply system: James Mason","Earlier images from the project archive; photographer and render author not recorded"],"outcome":"A system with the natural-ply riser section is finished and currently at TPI's factory.","gallery":["mfr-exterior","mfr-installation","mfr-riser-system"]},{"id":"totem-2","category":"sound","title":"Type. TOTEM 2","context":"TPI Aerospace Limited · released","summary":"TPI's flagship ground-stack system: modular, V-fronted cabinets that stack in different configurations to suit the audience and the room. I re-engineered Type. TOTEM from version 1 into Type. TOTEM 2, developing the design for more efficient, achievable manufacturing.","mine":["Re-engineering from version 1 for more efficient, achievable manufacturing","Re-specified the carbon-fibre horn for a different manufacturer, incorporating improvements","A detailed live bill of materials in Google Sheets"],"credits":["Type. TOTEM version 1: TPI's earlier design","Product photographs: TPI"],"outcome":"Released by TPI and listed on TPI's website.","links":[{"label":"TPI: Type. TOTEM 2","href":"https://www.tpi.co.uk/products/type-totem-2"}],"gallery":["totem-2-front","totem-2-rear"]},{"id":"picture","category":"sound","title":"Picture","context":"TPI Aerospace Limited · 2024 · concept","summary":"A compact wall-mounted loudspeaker, developed in response to distributor feedback, for rooms where a full cinema system isn't practical. It was designed for efficient in-house manufacture, easy installation and visual discretion, and presented as a concept at an AV show in Denver.","sections":[{"title":"Brief","text":"Distributor feedback pointed to rooms where a full cinema system isn't viable. Picture answers with a compact speaker that hangs on the wall beside the screen and stays visually discreet."},{"title":"Sketches","text":"The July 2024 ideation sheet explores forms for the wall: angled and wedge-shaped cabinets, framed baffles and grilles, colour studies and a wall-mounting detail."},{"title":"Design and engineering","text":"The chosen design pairs a white angled cabinet with a dark baffle carrying a tweeter and a mid-bass driver. The exploded render lays out its parts, from the front panels and drivers to the white frame and rear panel, with manufacture in TPI's own workshop and quick installation in mind."}],"mine":["Design and engineering, from the July 2024 ideation sketches to CAD","The renders, exploded and in situ"],"outcome":"Presented as a concept at an AV show in Denver.","gallery":["picture-wall","picture-room","picture-in-situ","picture-exploded","picture-sketches"]},{"id":"homewhere","category":"objects","title":"homeWHERE furniture","context":"Freelance · 2019–2025","summary":"A concept furniture range designed ahead of the company's launch. After a pause during the pandemic, the lounge chair and stool were prototyped and refined with an upholsterer towards production.","mine":["Freelance furniture design and renders","Prototype refinement with an upholsterer"],"gallery":["homewhere-render"]},{"id":"type-29","category":"objects","title":"Type. 29 mixer","context":"TPI Aerospace Limited · 2023–2025 · publicly shown","summary":"Mechanical design of a fully analogue mixer built from interchangeable, fully removable channel modules, so each chassis can be specified for its owner.","mine":["Mechanical design of the chassis, panels and module system","3D models and product details for the renders","A component calculator I built independently in Google Sheets"],"credits":["Analogue circuit design: Steve Ireland, Redstreak Limited","Renders: Northern Artillery, from my 3D models"],"outcome":"TPI has announced Type. 29 in 2, 4, 6 and 8-channel chassis with Phono/Line and Class A Mic/Line modules. It is installed at Tomodachi, Ibiza; wider release is still to come.","links":[{"label":"TPI: Tomodachi installation","href":"https://www.tpi.co.uk/products/tomodachi-ibiza-es"}],"gallery":["type-29-product-front","type-29-product-rear","type-29-product-top"]},{"id":"gmt-one","category":"objects","title":"GMT One turntable","context":"Wilson Benesch · 2017–2018 · early development","summary":"Early development work on the GMT One turntable system, which was released after I left Wilson Benesch.","mine":["Drawings, models and manufacturing files for the initial prototype","Models of subassemblies including the OMEGA drive and the Graviton tonearm","Most of the earliest release media, modelled and rendered in KeyShot"],"credits":["Engineering across the GMT One consortium","Release images shown here: Wilson Benesch"],"gallery":["gmt-released-detail","wb-gmt-omega-drive"]},{"id":"factory-stairs","category":"objects","title":"Factory staircase","context":"TPI Aerospace Limited · installed","summary":"Factory staircase for TPI. I designed the staircase and produced the technical drawings.","mine":["Design of the staircase","The technical drawings"],"outcome":"Installed in TPI's factory.","gallery":["stairs-landing","stairs-flights"]},{"id":"looop","category":"music","title":"Looop","context":"Sheffield Hallam University · 2017 · final-year project","summary":"A self-contained music-production concept for beginners, making rhythm, melody and song structure approachable through hands-on play.","mine":["Research, concept, sketches, CAD and renders","A visual physical prototype (non-functional)"],"gallery":["looop-render","looop-prototype"]},{"id":"seed","category":"music","title":"Seed part generators","context":"Personal projects · 2026 · working prototypes","summary":"Drumseed, Voiceseed and Chipseed are desktop instruments for writing music. Each one generates a strange but usable part — a whole drum song, a vocal fragment or a chip-style melody — and gives you controls that steer what the generator decides, instead of editing notes.","sections":[{"title":"Drumseed","text":"Writes one complete drum song. A live-drum reference shapes the structure and an electronic reference shapes the behaviour. The song map shows each section's planned intensity, its real density and where it returns to earlier material. It exports MIDI, an Ableton Drum Rack with the sound design built in, and an audio preview."},{"title":"Voiceseed","text":"Makes vocal sounds two to eight seconds long. Seven controls run from nonsense to language, machine to human and clean to wrecked; each is left to the generator or pinned by hand. Mutate grows relatives of a sound you like, and each sound can be cut into up to eight labelled pieces, ready for a drum rack."},{"title":"Chipseed","text":"Grows short chip-style melodies. Eight macro faders end in a red zone where the music is allowed to break down, and gene locks keep the pitch, rhythm, shape, voice or timing through each mutation. It exports WAV and MIDI."}],"mine":["The original concepts, parameters and their vocabulary","Musical rules, test criteria and listening evaluation"],"credits":["Software written with AI coding tools, directed by my rules and checked by listening and automated tests"],"outcome":"Three working desktop prototypes, September 2026; not released.","gallery":["seed-chipseed","seed-drumseed-map","seed-voiceseed"]},{"id":"remote-object","category":"music","title":"Remote Object","context":"Personal project · 2026 · browser prototype","summary":"A musical keyring in the browser. A metal ring hangs in the dark with eight devices on it, and you handle them rather than read a menu: turn the ring, turn a device until it faces you, then pick it up and use it. One device plays a small archive of Field Unit tracks; the others speak, sing, mangle the sound or, on purpose, do nothing at all.","sections":[{"title":"RO-404 · Reclamation unit","text":"The handheld, and the only conventional interface on the ring: a dot-matrix screen that browses the archive and plays it, with a waveform drawn from the live audio. It hangs facing away, so you have to turn it round before you can use it."},{"title":"P-9 · Pronouncer","text":"Type at it and press return, and it says your words out loud, badly, through a formant synthesiser. The strip shows the phonemes it decided your text contained, and the four blades over its speaker open and close with the sounds."},{"title":"W-2 · Weather unit","text":"A rotor that sings while it spins. Every spin-up makes a new atmosphere, and its level and brightness follow how fast it is actually turning, so the sound winds down with it."},{"title":"K-4 · Treatment unit","text":"A lever and a plunger. The plunger picks two to four effects at random, from bit reduction, drive, filters, ring modulation, tremolo and delay, and they treat everything the object makes. The picture changes with the sound: bit reduction lowers the render resolution."},{"title":"S-7 · Sampler","text":"An embroidery hoop, a spool and a cutter. Each drag is one straight stitch; cut the work free and it drifts off into the dark."},{"title":"A-17, ?? and 31","text":"A key that refuses rather than fake a login, an unlabelled device that watches the cursor, and a token that is not electronic and does nothing. Their purposes are deliberately left open in this prototype."}],"mine":["Original idea, the devices and how they are handled, visual language and direction"],"credits":["Implemented with AI coding tools"],"outcome":"Working browser prototype, September 2026. Contributor accounts and uploads, behind the key, are not built.","action":{"label":"Try the instrument","href":"remote-object/","note":"Opens the full instrument. It makes no sound until you use a device; Esc puts a device down."},"gallery":["remote-object-ring","remote-object-archive","remote-object-playing","remote-object-pronouncer"]},{"id":"record-room","category":"music","title":"Record room","context":"Personal project · 2026 · browser prototype","summary":"A listening room in the browser: dig through a shelf, drop a record on each deck, cue by dragging the tonearm and blend with a crossfader. One control crushes picture and sound together to 8 or 4 bits.","mine":["Original idea, interaction design, visual language and direction"],"credits":["Implemented with AI coding tools"],"gallery":["record-room-overview","record-room-deck","record-room-shelf"]},{"id":"crate-packing","category":"making","title":"Crate packing tool","context":"TPI Aerospace Limited · self-directed · in use","summary":"A 3D bin-packing tool I created to plan shipping crates at TPI. Any combination of speakers can go in — a hi-fi pair, a PA system or a full cinema installation — and it works out how everything packs, then produces what the workshop, the customer and the shipper each need.","sections":[{"title":"What it produces","list":["A 3D layout of every crate","A crate list with sizes","External dimensions and weights for the customer, ahead of time","DXF cut files","Assembly drawings"],"note":"All calculated from product data I entered."},{"title":"Why it matters","text":"Crates and foam inserts used to be laid out from experience, job by job. Now one set of inputs gives a consistent packing plan, the figures the customer needs to arrange shipping, and the files and drawings to build the crates, without drawing each crate from scratch."},{"title":"Built around TPI","text":"It is shaped around TPI's own products, crate construction and workshop, so the plans match the way TPI actually builds and ships."}],"mine":["Spotted the need and developed the tool on my own initiative","Concept, design and development of the tool","The product data it calculates from","Packing design, including crates and foam inserts"],"credits":["Software written with AI coding tools, which I directed"],"outcome":"Active and in use at TPI.","gallery":["crate-front-off","crate-foam-inserts","crate-stack"]},{"id":"turntable-instructions","category":"making","title":"Technics 1210 Instructions","context":"Mastersounds · freelance · 2025","summary":"Instruction drawings for customers taking a Technics 1210 apart, fitting a new Mastersounds tonearm and packing the turntable for transport to Mastersounds.","sections":[{"title":"The drawing set","list":["The assembled turntable","The exploded stack: platter and tonearm, top plate, chassis and base","The top plate with platter and tonearm","The base and its casting","The base with its feet removed","The lid"],"note":"Each drawing is an isometric view taken from one SharkCAD model."}],"mine":["Isometric instruction and packaging drawings from a SharkCAD model"],"outcome":"In use as customer instructions.","gallery":["mastersounds-1210-assembled","mastersounds-1210-exploded","mastersounds-1210-top","mastersounds-1210-base","mastersounds-1210-feet","mastersounds-1210-lid"]},{"id":"live-bom","category":"making","title":"Live BOM system","context":"TPI Aerospace Limited · Google Sheets","summary":"A live bill-of-materials structure I have been building in Google Sheets, including the component calculator for the modular Type. 29 mixer.","mine":["Structure and development of the system"]},{"id":"embroidered-patches","category":"personal","title":"Hand-embroidered patches","context":"Personal project","galleryLayout":"grid","captions":false,"gallery":["patch-soldier","patch-soldier-angle","patch-pigeon","patch-tower-block","patch-brick-bridge","patch-cooling-tower"]},{"id":"field-unit","category":"personal","title":"Field Unit","context":"Personal project · music and website · live","summary":"Field Unit is my music, and field-unit.co.uk is where it lives: twelve demo tracks with their artwork, a radio that plays them one after another, a CHIP FX switch that swaps every track for a chip-style treatment of the same recording and coarsens the picture to match, ink you can draw across the page, and a robot that dances in the same grain.","mine":["All of the music and the website"],"credits":["Website built with AI coding tools"],"outcome":"Live at field-unit.co.uk.","action":{"label":"Visit field-unit.co.uk","href":"https://field-unit.co.uk/","external":true,"note":"Opens the music site in a new tab. Nothing plays on its own."},"gallery":["field-unit-site","field-unit-chip"]}],"cv":{"headline":"Product Design Engineer — Audio, Prototyping & Creative Technology","profile":"Product design engineer in audio since 2017. I take loudspeakers, hi-fi products and electronics enclosures from brief through CAD, drawings and prototypes to manufacture, working with electronics and acoustic engineers, fabricators, suppliers and the workshop. Alongside that I design generative music tools, setting the concept, rules and test criteria, with the software built using AI coding tools.","experience":[{"role":"Design Engineer","org":"TPI Aerospace Limited","dates":"Jan 2019 – present","text":"Loudspeakers, hi-fi, PA and mixer hardware from brief to production: SharkCAD models and drawings, BOM systems in Google Sheets, supplier specifications and prototyping with fabricators."},{"role":"Design Engineer","org":"Wilson Benesch","dates":"Oct 2017 – Dec 2018","text":"Eminence and Precision loudspeakers and GMT One turntable development: SolidWorks models, drawings, BOMs, KeyShot renders and an in-house 3D-printing workflow."}],"education":"BA (Hons) Product Design, First Class — Sheffield Hallam University, 2014–2017","skills":[{"group":"Design and CAD","items":"SharkCAD, SolidWorks, KeyShot, Blend
